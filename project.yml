name: Decorrelate
options:
  bundleIdPrefix: io.burns
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DecorrelationStretch:
    path: .

# Both apps build from the same sources in App/Decorrelate. Platform differences are
# handled with #if inside those files rather than by forking the tree, which for an app
# this size is less to keep in sync.
targets:
  Decorrelate:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App/Decorrelate
        excludes:
          - "Info.plist"
          - "Info-iOS.plist"
          - "Decorrelate.entitlements"
    dependencies:
      - package: DecorrelationStretch
        product: DecorrelationStretch
    entitlements:
      path: App/Decorrelate/Decorrelate.entitlements
      properties:
        # Sandbox is off deliberately: this is a local research tool, and the sandbox
        # blocks command-line file paths and forces security-scoped bookmarks for drops.
        # Hardened runtime stays on, which is what makes the camera entitlement required.
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Decorrelate/Info.plist
      properties:
        CFBundleName: Decorrelate
        CFBundleDisplayName: Decorrelate
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.photography
        NSHighResolutionCapable: true
        NSCameraUsageDescription: Decorrelate previews the decorrelation stretch filter on the live camera feed.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.Decorrelate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: true
        SWIFT_STRICT_CONCURRENCY: minimal

  Decorrelate-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Decorrelate
        excludes:
          - "Info.plist"
          - "Info-iOS.plist"
          - "Decorrelate.entitlements"
    dependencies:
      - package: DecorrelationStretch
        product: DecorrelationStretch
    info:
      path: App/Decorrelate/Info-iOS.plist
      properties:
        CFBundleName: Decorrelate
        CFBundleDisplayName: Decorrelate
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Decorrelate previews the decorrelation stretch filter on the live camera feed.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.burns.Decorrelate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 45T95LQM6S
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Metal shaders are compiled at build time for the app target; the package's own
        # shader falls back to runtime compilation, which needs no offline toolchain.
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

schemes:
  Decorrelate:
    build:
      targets:
        Decorrelate: all
    run:
      config: Debug
  Decorrelate-iOS:
    build:
      targets:
        Decorrelate-iOS: all
    run:
      config: Debug
